[package]
name = "librecurse"
version = "0.1.0"
description = "Independent agent framework for Recurse: LLM run loop and tool runtime"
authors = ["Aayush Khanna"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "librecurse"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# Static binary analysis (native engine, r2 backend, shared architecture and
# disassembly). Systems code lives there, not in the agent.
recurse-static = { path = "../recurse-static" }

[dev-dependencies]
# Async runtime + macros for the local-endpoint integration test.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Same bar as the Tauri shell: no silent panics on poisoned locks or bad
# UTF-8 from external processes.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
