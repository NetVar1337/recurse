[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "recurse-py"
description = "Python bindings for Recurse's binary-analysis engine: open a binary and call functions/disasm/graph/lift/decompile/xrefs/strings/imports/info directly from Python -- no IDA seat, no GUI, no external tool for the native backend."
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Security",
  "Topic :: Software Development :: Disassemblers",
  "License :: OSI Approved :: Apache Software License",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "recurse_py"
