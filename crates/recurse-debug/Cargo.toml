[package]
name = "recurse-debug"
description = "Cross-platform, from-scratch debugger for Recurse (launch/attach, breakpoints, stepping, registers, memory)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Architecture detection and disassembly (shared with the static engine, so
# Capstone is configured in exactly one place).
recurse-static = { path = "../recurse-static" }

[target.'cfg(target_os = "linux")'.dependencies]
# ptrace + waitpid + signals for the Linux backend. All permissive.
nix = { version = "0.31", features = ["ptrace", "signal", "process"] }
libc = "0.2"

[dev-dependencies]
# The integration test resolves fixture symbols by parsing the ELF itself.
object = "0.36"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_Security",
    "Win32_Foundation",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Same bar as the rest of the workspace: no silent panics.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
