name: CLA
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.5.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/Recurse-Labs/recurse/blob/main/CLA-INDIVIDUAL.md
          allowlist: dependabot[bot],github-actions[bot]
          remote-organization-name: Recurse-Labs
          remote-repo-name: recurse
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thanks!
