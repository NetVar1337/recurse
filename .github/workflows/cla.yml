name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.5.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/Recurse-Labs/recurse/blob/master/CLA-INDIVIDUAL.md
          branch: master
          allowlist: aayush0325,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: Thank you for your contribution. Please read the CLA (CLA-INDIVIDUAL.md, or CLA-CORPORATE.md for company work) and sign by commenting "I have read the CLA Document and I hereby sign the CLA". Corporate contributors email ayush25khanna@gmail.com once per company.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thanks!
          lock-pullrequest-aftermerge: true
